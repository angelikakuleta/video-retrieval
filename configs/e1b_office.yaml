experiment: E1-B
dataset: office
seed: 1234
segmentation:
  strategy: shots_histogram
  min_len_s: 3.0
  max_len_s: 15.0
  window_s: 10.0
  histogram_threshold: 0.5
frames:
  step_s: 1.25
  dedup_cosine: 0.9
components:
  scene_embedding:
    enabled: true
    model: openclip_vit_h14
  caption:
    enabled: false
  objects:
    enabled: false
  face_regions:
    enabled: false
  identity:
    enabled: false
  motion:
    enabled: false
scoring:
  scope: full_collection
  normalization: zscore
  weights:
    mode: uniform
evaluation:
  report_by:
  - requirements
  - complexity
